server:
  port: 8087

spring:
  application:
    name: prescription-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/hms_prescription
    username: hms_user
    password: hms_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  cloud:
    discovery:
      enabled: true
      service-id: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hms.prescription: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE 