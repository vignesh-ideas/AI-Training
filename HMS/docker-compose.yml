version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: hms-postgres
    environment:
      POSTGRES_DB: hms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hms-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: hms-redis
    ports:
      - "6379:6379"
    networks:
      - hms-network

  # Discovery Service (Eureka)
  discovery-service:
    build: ./discovery-service
    container_name: hms-discovery
    ports:
      - "8761:8761"
    depends_on:
      - postgres
    networks:
      - hms-network

  # Config Service
  config-service:
    build: ./config-service
    container_name: hms-config
    ports:
      - "8888:8888"
    depends_on:
      - discovery-service
    networks:
      - hms-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: hms-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
      - config-service
    networks:
      - hms-network

  # User Service
  user-service:
    build: ./user-service
    container_name: hms-user-service
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
      - config-service
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Patient Service
  patient-service:
    build: ./patient-service
    container_name: hms-patient-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Appointment Service
  appointment-service:
    build: ./appointment-service
    container_name: hms-appointment-service
    ports:
      - "8083:8083"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Medical Records Service
  medical-records-service:
    build: ./medical-records-service
    container_name: hms-medical-records-service
    ports:
      - "8084:8084"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Vitals Service
  vitals-service:
    build: ./vitals-service
    container_name: hms-vitals-service
    ports:
      - "8085:8085"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Lab Service
  lab-service:
    build: ./lab-service
    container_name: hms-lab-service
    ports:
      - "8086:8086"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Prescription Service
  prescription-service:
    build: ./prescription-service
    container_name: hms-prescription-service
    ports:
      - "8087:8087"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Notification Service
  notification-service:
    build: ./notification-service
    container_name: hms-notification-service
    ports:
      - "8088:8088"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Chat Service
  chat-service:
    build: ./chat-service
    container_name: hms-chat-service
    ports:
      - "8089:8089"
    depends_on:
      - discovery-service
      - config-service
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - hms-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: hms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - hms-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: hms-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - hms-network

volumes:
  postgres_data:
  grafana_data:

networks:
  hms-network:
    driver: bridge 